name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - name: Build static preview
        env:
          GITHUB_PAGES: "1"
        run: npm run build:pages
      - name: Prepare publish folder
        run: |
          set -e
          if [ -d dist/client ]; then
            DIR=dist/client
          elif [ -d .output/public ]; then
            DIR=.output/public
          else
            echo "No client build folder"
            ls -la
            exit 1
          fi

          echo "Client folder: $DIR"
          ls -la "$DIR" | head -40

          # Folder pages GitHub Pages can open at /about/ and /contact/
          for page in about contact get-started decks-by-pfeifer; do
            if [ -f "$DIR/$page.html" ] && [ ! -f "$DIR/$page/index.html" ]; then
              mkdir -p "$DIR/$page"
              cp "$DIR/$page.html" "$DIR/$page/index.html"
            fi
          done

          if [ ! -f "$DIR/index.html" ]; then
            if [ -f "$DIR/index/index.html" ]; then
              cp "$DIR/index/index.html" "$DIR/index.html"
            fi
          fi

          if [ -f "$DIR/index.html" ] && grep -q "Transparent Pricing" "$DIR/index.html" && ! grep -q "Transform your space" "$DIR/index.html"; then
            HOME=$(grep -rl "Transform your space with Pfeifer" "$DIR" --include='index.html' --include='*.html' | head -1 || true)
            if [ -n "$HOME" ]; then
              echo "Replacing wrong homepage with $HOME"
              cp "$HOME" "$DIR/index.html"
            fi
          fi

          if [ ! -f "$DIR/index.html" ]; then
            echo "Missing homepage index.html"
            find "$DIR" -name index.html | head -30
            exit 1
          fi

          cp -a public/images "$DIR/" 2>/dev/null || true
          cp -a public/videos "$DIR/" 2>/dev/null || true
          cp -a public/favicon.svg "$DIR/" 2>/dev/null || true
          cp -a public/og.jpg "$DIR/" 2>/dev/null || true

          touch "$DIR/.nojekyll"
          cp "$DIR/index.html" "$DIR/404.html"

          echo "PUBLISH_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Homepage title check:"
          grep -o "<title>[^<]*</title>" "$DIR/index.html" | head -3 || true
          ls "$DIR/about" 2>/dev/null || true
          ls "$DIR/contact" 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
